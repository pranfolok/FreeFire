<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Message</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 14px; margin: 16px 0 6px; color: var(--text); }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    textarea { resize: vertical; min-height: 110px; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 18px; font-size: 14px; text-align: center; min-height: 20px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Leave a Message</h1>
    <p class="sub">Type something and hit send — it gets stored so the owner can read it.</p>

    <form id="myForm">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" placeholder="Jane Doe" required />

      <label for="email">Your email (optional)</label>
      <input id="email" name="email" type="email" placeholder="jane@example.com" />

      <label for="message">Your message</label>
      <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

      <button type="submit" id="submitBtn">Send</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    // ============================================================
    // CHOOSE YOUR FREE BACKEND BY EDITING THESE LINES:
    // ------------------------------------------------------------
    // OPTION A (Google Sheet)  -> paste your Apps Script URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8ipqf5oCVQ3q5oqOPedQegJp_8ivTRz_0arwYbFwxhqV2H7nCSuUish3zQfEAlwzO/exec";
    // OPTION B (Formspree)     -> paste your Formspree endpoint here:
    const FORMSPREE_URL = "";
    // OPTION C (Netlify Forms) -> set to true and follow the README:
    const USE_NETLIFY = false;
    // ============================================================

    const form = document.getElementById("myForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "msg";
      btn.disabled = true;
      btn.textContent = "Sending...";

      const data = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value,
        submitted: new Date().toISOString()
      };

      try {
        if (USE_NETLIFY) {
          // Netlify Forms: send as form-encoded with the form name
          const fd = new FormData(form);
          fd.append("form-name", "myForm");
          await fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams(fd).toString()
          });
        } else if (SCRIPT_URL) {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
        } else if (FORMSPREE_URL) {
          await fetch(FORMSPREE_URL, {
            method: "POST",
            headers: { "Accept": "application/json" },
            body: new FormData(form)
          });
        } else {
          throw new Error("No backend configured. Open index.html and set SCRIPT_URL, FORMSPREE_URL, or USE_NETLIFY.");
        }

        form.reset();
        msg.textContent = "✅ Thanks! Your message was sent.";
        msg.className = "msg ok";
      } catch (err) {
        msg.textContent = "❌ Something went wrong. Please try again.";
        msg.className = "msg err";
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Send";
      }
    });
  </script>
</body>
</html>
